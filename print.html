<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Print Order</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 400px;
        margin: auto;
      }

      .receipt {
        border: 1px dashed #000;
        padding: 15px;
      }

      h2 {
        text-align: center;
      }

      .line {
        border-top: 1px dashed #000;
        margin: 10px 0;
      }

      button {
        width: 100%;
        padding: 10px;
        background: black;
        color: white;
        border: none;
        margin-top: 10px;
        cursor: pointer;
      }

      @media print {
        button {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="receipt">
      <h2>HUNGRY LION</h2>

      <p><strong>Order ID:</strong> <span id="orderId"></span></p>

      <div class="line"></div>

      <h3>Items</h3>
      <div id="items"></div>

      <div class="line"></div>

      <p><strong>Total:</strong> E<span id="total"></span></p>
      <p><strong>Status:</strong> PAID</p>
    </div>

    <button onclick="window.print()">PRINT ORDER</button>

    <script>
      const params = new URLSearchParams(window.location.search);

      const orderId = params.get("orderId");
      const total = params.get("total");
      const items = JSON.parse(params.get("items") || "[]");

      document.getElementById("orderId").innerText = orderId || "N/A";
      document.getElementById("total").innerText = total || 0;

      const itemsDiv = document.getElementById("items");

      if (items.length === 0) {
        itemsDiv.innerHTML = "<p>No items found</p>";
      } else {
        items.forEach((item) => {
          let p = document.createElement("p");
          p.innerText = `${item.name} - E${item.price}`;
          itemsDiv.appendChild(p);
        });
      }
    </script>
  </body>
</html>
