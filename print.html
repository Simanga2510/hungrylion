<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Order</title>

    <style>
      body {
        font-family: "Courier New", monospace;
        background: #f5f5f5;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .receipt {
        width: 100%;
        max-width: 320px;
        background: white;
        padding: 20px;
        border: 1px dashed #000;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin: 0;
        font-size: 20px;
        letter-spacing: 1px;
      }

      .sub {
        text-align: center;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .line {
        border-top: 1px dashed #000;
        margin: 10px 0;
      }

      .info {
        font-size: 13px;
        margin-bottom: 10px;
      }

      #items p {
        margin: 5px 0;
        font-size: 13px;
      }

      .total {
        font-weight: bold;
        font-size: 14px;
        margin-top: 10px;
      }

      .status {
        text-align: center;
        font-weight: bold;
        margin-top: 10px;
        color: green;
      }

      button {
        width: 100%;
        padding: 10px;
        background: black;
        color: white;
        border: none;
        margin-top: 10px;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        background: #333;
      }

      @media print {
        button {
          display: none;
        }

        body {
          background: white;
          padding: 0;
        }

        .receipt {
          box-shadow: none;
          border: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="receipt">
      <h2>HUNGRY LION</h2>
      <div class="sub">ORDER RECEIPT</div>

      <div class="line"></div>

      <div class="info">
        <p><strong>Order ID:</strong> <span id="orderId"></span></p>
        <p><strong>Date:</strong> <span id="date"></span></p>
      </div>

      <div class="line"></div>

      <h3>Items</h3>
      <div id="items"></div>

      <div class="line"></div>

      <p class="total">TOTAL: E<span id="total"></span></p>

      <div class="status">PAID ✔</div>
    </div>

    <button onclick="window.print()">PRINT ORDER</button>

    <script>
      const params = new URLSearchParams(window.location.search);

      const orderId = params.get("orderId");
      const total = params.get("total");
      const items = JSON.parse(params.get("items") || "[]");

      document.getElementById("orderId").innerText = orderId || "N/A";
      document.getElementById("total").innerText = total || 0;

      // Date
      const now = new Date();
      document.getElementById("date").innerText = now.toLocaleString();

      const itemsDiv = document.getElementById("items");

      if (items.length === 0) {
        itemsDiv.innerHTML = "<p>No items found</p>";
      } else {
        items.forEach((item) => {
          let p = document.createElement("p");
          p.innerText = `${item.name} - E${item.price}`;
          itemsDiv.appendChild(p);
        });
      }
    </script>
  </body>
</html>
