<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment Gateway</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #fffaf0;
        text-align: center;
        padding: 40px;
      }

      h1 {
        color: #d62828;
      }

      .box {
        max-width: 400px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 12px;
        border: 2px solid #fcbf49;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      }

      .method {
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        background: #fff3e0;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      .method:hover {
        background: #ffe0b2;
      }

      .pay-btn {
        margin-top: 20px;
        padding: 10px;
        width: 100%;
        border: none;
        background: #d62828;
        color: white;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
      }

      .pay-btn:hover {
        background: #b71c1c;
      }

      .note {
        font-size: 12px;
        margin-top: 10px;
        color: #777;
      }
    </style>
  </head>

  <body>
    <h1>Secure Payment</h1>

    <div class="box">
      <p>Select Payment Method</p>

      <!-- Payment Methods (names only as requested) -->
      <div class="method">Bank Card</div>
      <div class="method">MoMo</div>

      <button class="pay-btn" onclick="completePayment()">
        Complete Payment
      </button>

      <p class="note">Demo payment page for ordering system</p>
    </div>

    <script>
      function completePayment() {
        window.location.href = "index.html?status=success";
      }
    </script>
  </body>
</html>
